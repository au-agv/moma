[tool.poetry]
name = "moma"
version = "1.0.0"
description = "Ground vehicles mobility mapping toolkit."
authors = ["Dario Sirangelo <dsi@aarhusrobotics.com>"]
readme = "README.md"
packages = [{include = "moma", from= "src"}]

[tool.poetry.dependencies]
colorama = "=0.4.6"
coloredlogs = "=15.0.1"
python = ">=3.10,<3.12"
geopandas = "=0.13.0"
matplotlib = "=3.7.1"
networkx = "=3.1"
numpy = ">=1.19.5,<1.27.0"
opencv-python = "4.7.0.72"
pandas = "2.0.2"
pyyaml = "6.0"
rasterio = "1.3.7"
scipy = "=1.10.1"
shapely = "2.0.6"
terracotta = "0.8.0"
jax = "<=0.5.0"
argparse = "^1.4.0"
requests = "^2.32.3"
fiona = "~1.9.6"

[tool.poetry.group.documentation.dependencies]
breathe = "^4.35.0"
furo = "^2023.9.10"
sphinx = "^7.2.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"